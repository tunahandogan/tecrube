<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Erzurum Taşı</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Archivo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#1f1c1a;color:#e9e2d6;font-family:Archivo,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 64px;border-bottom:1px solid #4a3f37}
.logo{font-family:Marcellus;font-size:30px;letter-spacing:.08em}
nav{display:flex;gap:32px;font-size:15px}
.btn{background:#1d7f86;color:#fff;padding:12px 20px;font-weight:700}
.portal{margin:40px auto 0;width:980px;height:620px;background:#8c4a32;position:relative;padding:28px;
clip-path:polygon(0 100%,0 22%,50% 0,100% 22%,100% 100%)}
.inner{position:absolute;inset:28px;background:#2a2421;clip-path:polygon(0 100%,0 23%,50% 2%,100% 23%,100% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 80px 40px}
h1{font-family:Marcellus;font-size:92px;line-height:1;font-weight:400}
p{font-size:20px;margin-top:20px;max-width:560px;line-height:1.5;color:#cfc6b7}
.doors{display:flex;gap:20px;margin-top:36px}
.doors div{width:240px;padding:20px;border:2px solid #c7a25a;font-family:Marcellus;font-size:36px}
.band{position:absolute;left:0;right:0;bottom:0;height:56px;background:repeating-linear-gradient(45deg,#1d7f86 0 14px,#16626a 14px 28px)}
</style></head><body>
<header><div class="logo">ER TECRÜBE</div><nav><span>YKS</span><span>LGS</span><span>Kabin</span><span>İletişim</span></nav><span class="btn">Ön kayıt</span></header>
<div class="portal"><div class="inner"><h1>Erzurum'da<br>tecrübeyle hazırlık</h1><p>YKS'de kabin sistemi ve özel ders. LGS'de sınıf dersleri ve özel ders.</p><div class="doors"><div>YKS</div><div>LGS</div></div></div></div>
<div class="band"></div>
</body></html>
