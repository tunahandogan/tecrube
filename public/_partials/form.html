<form class="enroll-form" novalidate data-enroll-form>
  <div class="field">
    <label for="f-ad">Öğrenci ya da veli adı soyadı</label>
    <input id="f-ad" name="ad" type="text" autocomplete="name" required minlength="3" maxlength="80" placeholder="Örn. Ayşe Yılmaz">
    <p class="field-error" id="f-ad-error" hidden></p>
  </div>
  <div class="field">
    <label for="f-telefon">Telefon</label>
    <input id="f-telefon" name="telefon" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="05xx xxx xx xx">
    <p class="field-error" id="f-telefon-error" hidden></p>
  </div>
  <div class="field">
    <label for="f-program">Program</label>
    <div class="select-wrap">
      <select id="f-program" name="program" required>
        <option value="">Sınıf / program seçin</option>
        <optgroup label="LGS Hazırlık">
          <option>LGS - 6. sınıf</option><option>LGS - 7. sınıf</option><option>LGS - 8. sınıf</option>
        </optgroup>
        <optgroup label="YKS Hazırlık">
          <option>YKS - 9. sınıf</option><option>YKS - 10. sınıf</option><option>YKS - 11. sınıf</option><option>YKS - 12. sınıf</option><option>YKS - Mezun</option>
        </optgroup>
        <option>Özel ders</option>
      </select>
      <svg class="icon"><use href="#i-chevron"/></svg>
    </div>
    <p class="field-error" id="f-program-error" hidden></p>
  </div>
  <div class="field field-note">
    <label for="f-not">Notunuz <span>(isteğe bağlı)</span></label>
    <textarea id="f-not" name="not" rows="3" maxlength="500" placeholder="Aramamızı istediğiniz saat, merak ettiğiniz ders vb."></textarea>
  </div>
  <div class="hp" aria-hidden="true"><label for="f-website">Web sitesi</label><input id="f-website" name="website" tabindex="-1" autocomplete="off"></div>
  <div class="field">
    <label class="check"><input type="checkbox" name="kvkk" id="f-kvkk" required><span><a href="/kvkk" target="_blank">Aydınlatma metnini</a> okudum; bilgilerimin ön kayıt için kullanılmasını onaylıyorum.</span></label>
    <p class="field-error" id="f-kvkk-error" hidden></p>
  </div>
  <button class="btn btn-yellow btn-block btn-lg" type="submit"><span>Ön kaydımı gönder</span><svg class="icon"><use href="#i-send"/></svg></button>
  <p class="form-status" role="status" aria-live="polite"></p>
</form>
<div class="form-success" hidden tabindex="-1">
  <span class="success-icon"><svg class="icon"><use href="#i-check"/></svg></span>
  <h3>Ön kaydınız bize ulaştı.</h3>
  <p>Kurumumuz en kısa sürede sizi arayacak. Beklemek istemezseniz hemen arayabilirsiniz.</p>
  <a class="btn btn-outline btn-block" href="tel:+904424425225"><svg class="icon"><use href="#i-phone"/></svg>0442 442 52 25</a>
</div>
